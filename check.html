<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>source check</title>
</head>
<body>
<pre id="out">checking...</pre>
<script>
fetch('./').then(function(r){return r.text();}).then(function(t){
  var lines=[];
  lines.push('length=' + t.length);
  lines.push('has eplus.jp: ' + (t.indexOf('eplus.jp') !== -1));
  lines.push('has infomochi_mochi: ' + (t.indexOf('infomochi_mochi') !== -1));
  lines.push('has info_melomelo: ' + (t.indexOf('info_melomelo') !== -1));
  lines.push('---source---');
  lines.push(t);
  document.getElementById('out').textContent = lines.join('\n');
}).catch(function(e){document.getElementById('out').textContent='FETCH ERROR: '+e;});
</script>
</body>
</html>
